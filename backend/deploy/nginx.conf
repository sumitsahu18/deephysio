# /etc/nginx/sites-available/deephysio   (Hostinger VPS)
# SSL: sudo certbot --nginx -d deephysio.co.uk -d www.deephysio.co.uk
server {
    listen 80;
    server_name deephysio.co.uk www.deephysio.co.uk;
    return 301 https://deephysio.co.uk$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.deephysio.co.uk;
    # certbot ye lines bharega
    return 301 https://deephysio.co.uk$request_uri;
}

server {
    listen 443 ssl http2;
    server_name deephysio.co.uk;
    # ssl_certificate ... (certbot)

    client_max_body_size 6m;          # image upload (MAX_UPLOAD_MB=5)
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5000;   # Express (SERVE_CLIENT=true) website + /api + /uploads
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS files (naam mein hash hai) - lamba cache
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

