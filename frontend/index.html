<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e0f2fe" />
  <meta name="description" content="DeePhysio - hands-on physiotherapy clinic in Smethwick, Birmingham." />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet" />
  <title>DeePhysio | Physiotherapy in Smethwick, Birmingham</title>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dp_site_cache_v1') || '{}');
        if (s.logoUrl) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = s.logoUrl;
          document.head.appendChild(l);
        }
        if (s.theme) {
          var vars = {
            primary: '--color-aqua',
            secondary: '--color-violet',
            accent: '--color-coral',
            background: '--color-deep',
            button: '--color-btn',
            buttonText: '--color-btn-text',
            text: '--color-text'
          };
          for (var k in vars) {
            if (s.theme[k]) document.documentElement.style.setProperty(vars[k], s.theme[k]);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
